    description: "Abstract representation of cloud enterprise architecture. Dark theme. Layered glowing grids, data streams, and structural blocks in deep blue and cyan. Professional, tech-forward."
    aspect_ratio: "16:9"
  - path: "artifacts/verionai-website/public/images/abstract-globe.png"
