kind = "web"
previewPath = "/"
title = "VerionAI Website"
version = "1.0.0"
id = "artifacts/verionai-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21292
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/verionai-website run dev"

[services.env]
PORT = "21292"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/verionai-website", "run", "build"]
publicDir = "artifacts/verionai-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
